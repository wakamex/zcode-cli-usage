name: Validation

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Check lockfile
        run: uv --no-config lock --check
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(uv --no-config version --short)"
      - name: Test
        run: uv --no-config run --locked python -m unittest discover -s tests
      - name: Build
        run: uv --no-config build --no-sources
